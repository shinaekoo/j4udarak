<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J4U 순모임 출석체크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{ --bg:#f6f4ef; --card:#fff; --ink:#1f2328; --sub:#6b7078; --line:#e7e3da;
    --yes:#2f6b4f; --yes-soft:#e3efe8; --no:#b4483c; --no-soft:#f6e3e0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button,input{font:inherit}
  button{cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 80px}
  header{position:sticky;top:0;z-index:5;background:rgba(246,244,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hbar{max-width:560px;margin:0 auto;padding:14px 16px 8px;font-weight:800;font-size:19px;letter-spacing:-.3px}
  .hbar small{display:block;font-weight:500;font-size:12px;color:var(--sub)}
  .tabs{max-width:560px;margin:0 auto;display:flex;gap:4px;padding:0 12px 10px}
  .tab{flex:1;border:0;background:transparent;padding:9px 0;border-radius:10px;color:var(--sub);font-weight:600}
  .tab.on{background:var(--ink);color:#fff}
  h2{font-size:14px;color:var(--sub);font-weight:700;margin:22px 4px 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.click{cursor:pointer}
  .name{font-weight:700;font-size:16px}
  .sub{font-size:13px;color:var(--sub)}
  .marks{display:flex;gap:6px;flex:none}
  .mk{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:700;color:var(--sub);font-size:14px}
  .mk.yes.on{background:var(--yes);border-color:var(--yes);color:#fff}
  .mk.no.on{background:var(--no);border-color:var(--no);color:#fff}
  .tools{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px;color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.danger{color:var(--no)}
  .big{width:100%;margin-top:16px;padding:15px 0;border:0;border-radius:12px;background:var(--yes);color:#fff;font-weight:800;font-size:16px}
  .form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}
  .field label{font-size:13px;color:var(--sub);font-weight:600}
  .field input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fbfaf7;min-width:0;width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .add{display:flex;gap:6px;margin:16px 0 4px}
  .add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
  .add button{white-space:nowrap}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
  .stat .n{font-size:22px;font-weight:800}
  .stat .l{font-size:12px;color:var(--sub)}
  .stat.yes .n{color:var(--yes)} .stat.no .n{color:var(--no)}
  .back{border:0;background:none;color:var(--sub);font-weight:600;padding:16px 0 0;font-size:14px}
  .evhead{margin-top:8px}
  .evhead .t{font-size:22px;font-weight:800;letter-spacing:-.4px}
  .pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f1efe9;color:var(--sub);white-space:nowrap}
  .pill.today{background:var(--yes);color:#fff}
  .pill.done{background:var(--yes-soft);color:var(--yes)}
  .bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--yes)}
  .empty{text-align:center;color:var(--sub);padding:28px 0;font-size:14px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;padding:80px 0;color:var(--sub)}
  .lock{max-width:320px;margin:90px auto 0;text-align:center}
  .lock h1{font-size:24px;margin:0 0 8px}
  .lock p{color:var(--sub);margin:0 0 24px}
  .lock input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-size:18px;background:#fff;margin-bottom:10px}
  .info{font-size:13px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
  .tel{color:var(--yes);font-weight:600;text-decoration:none;border:0;background:none;padding:0;font-size:13px}
  .bday-soon{background:#fdf1d8;color:#8a5a00;font-weight:700;border-radius:999px;padding:2px 8px;font-size:12px}
  .bdays{background:#fff8e8;border:1px solid #f1dfb4;border-radius:14px;padding:12px 14px;margin-top:14px}
  .bdays b{display:block;font-size:13px;color:#8a5a00;margin-bottom:6px}
  .bdays div{font-size:14px;padding:3px 0}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px 28px}
  .sheet a{display:block;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 0;margin-bottom:8px;font-weight:700;color:var(--ink);text-decoration:none;font-size:16px}
  .gender{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
  .gender.m{background:#e3ebf6;color:#3a5a8c} .gender.f{background:#f6e3ec;color:#8c3a62}
  .memo{margin-top:6px;font-size:13px;color:var(--ink);background:#f7f5f0;border-radius:8px;padding:7px 9px;white-space:pre-wrap;line-height:1.5}
  .memo-tools{display:inline-flex;gap:8px;margin-left:6px}
  .link{border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer}
  .link.danger{color:var(--no)}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;border:1px solid var(--line);background:#fbfaf7;border-radius:10px;padding:10px 0;font-weight:700;color:var(--sub)}
  .seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  textarea.memo-in{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfaf7;font:inherit;resize:vertical;min-height:70px;width:100%}
  .reason-row{padding:0 0 12px;margin-top:-4px;border-bottom:1px solid var(--line)}
  .reason-row input{width:100%;border:1px solid #efd3cf;background:var(--no-soft);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink)}
  .reason-row input::placeholder{color:#b98a84}
  .row.has-reason{border-bottom:0}
  .reason-row:last-child{border-bottom:0}
  .reason-btn{border:1px dashed #e3b9b3;background:#fff;color:var(--no);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
  .reason-text{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--no);background:var(--no-soft);border-radius:10px;padding:8px 12px}
  .reason-text span{flex:1}
  .sorter{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}
  .sorter h2{margin:0}
  .sortbtns{display:flex;background:#ebe8e1;border-radius:10px;padding:3px}
  .sortbtns button{border:0;background:none;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub)}
  .sortbtns button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .attcount{font-size:12px;font-weight:700;color:var(--yes);margin-left:6px;vertical-align:1px}
  .demo{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<header id="hdr" style="display:none">
  <div class="hbar">J4U 순모임 출석체크<small id="subtitle"></small></div>
  <div class="tabs">
    <button class="tab on" data-tab="events">일정</button>
    <button class="tab" data-tab="members">순원</button>
    <button class="tab" data-tab="stats">기록</button>
  </div>
</header>
<div class="wrap" id="app"><div class="loading">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script type="module">
/* =========================================================
   설정 — Firebase 값과 비밀번호만 채우면 됩니다
   ========================================================= */
const CONFIG = {
  GROUP_NAME: "J4U 순모임",
  // 이 페이지를 여는 비밀번호 (순장만 알면 됨). 빈칸("")이면 잠금 없이 열려요.
  PASSCODE: "1010",
  FIREBASE: {
    apiKey: "AIzaSyAmv1pHlLahYythXiT15cGqlEnHJEtg9e0",
    authDomain: "darak-attendance.firebaseapp.com",
  projectId: "darak-attendance",
  storageBucket: "darak-attendance.firebasestorage.app",
  messagingSenderId: "956597071783",
  appId: "1:956597071783:web:68c888e812316699769082",
  measurementId: "G-4YQZCZ2FPD"
  }
};
/* ========================================================= */

const DEMO = CONFIG.FIREBASE.apiKey.startsWith("YOUR_");
const WD = ["일","월","화","수","목","금","토"];
// Firestore: simple_members/{id} = {name, createdAt}
//            simple_events/{id}  = {date, time, title, marks:{memberId:"o"|"x"}}
const store = { members:{}, events:{} };
let fs = null, db = null, ready = false;

/* ---------- 저장소 ---------- */
async function initData(){
  if (DEMO){ Object.assign(store, JSON.parse(localStorage.getItem("simple_demo2") || '{"members":{},"events":{}}')); return; }
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  db = fs.getFirestore(initializeApp(CONFIG.FIREBASE));
  const first = (col, key) => new Promise(res => fs.onSnapshot(fs.collection(db, col), snap => {
    const m = {}; snap.forEach(d => m[d.id] = d.data()); store[key] = m; res(); if (ready && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.reason)) render();   // 결석 이유 입력 중에는 화면을 다시 그리지 않음
  }, err => { console.error(err); toast("데이터를 불러오지 못했어요"); res(); }));
  await Promise.all([first("simple_members","members"), first("simple_events","events")]);
}
const persist = ()=> { if (DEMO) localStorage.setItem("simple_demo2", JSON.stringify(store)); };
async function put(col, key, id, data){
  store[key][id] = { ...(store[key][id]||{}), ...data }; persist(); render();
  if (!DEMO) await fs.setDoc(fs.doc(db, col, id), data, { merge:true });
}
async function drop(col, key, id){
  delete store[key][id]; persist(); render();
  if (!DEMO) await fs.deleteDoc(fs.doc(db, col, id));
}
async function setMark(eid, mid, val, quiet){
  const e = store.events[eid]; e.marks = e.marks || {};
  if (val) e.marks[mid] = val; else delete e.marks[mid];
  persist(); if (!quiet) render();
  if (!DEMO) await fs.setDoc(fs.doc(db,"simple_events",eid), { marks:{ [mid]: val || fs.deleteField() } }, { merge:true });
}

async function setReason(eid, mid, text){
  const e = store.events[eid]; e.reasons = e.reasons || {};
  if (text) e.reasons[mid] = text; else delete e.reasons[mid];
  persist();
  if (!DEMO) await fs.setDoc(fs.doc(db,"simple_events",eid), { reasons:{ [mid]: text || fs.deleteField() } }, { merge:true });
}

/* ---------- 도우미 ---------- */
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = ()=> ymd(new Date());
const parse = s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const dLabel = s=>{ const d=parse(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const tLabel = t=>{ if(!t) return ""; let [h,m]=t.split(":").map(Number); const ap=h<12?"오전":"오후"; h=h%12||12; return `${ap} ${h}:${pad(m)}`; };
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = v=>String(v||"").trim().replace(/\s+/g," ");
const newId = p=> p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m, ms=1600){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),ms); }
/* 생일: "MM-DD"로 저장. 3/14, 3-14, 3월 14일, 1990-03-14 모두 입력 가능 */
function parseBday(v){
  v = String(v||"").trim(); if (!v) return "";
  const n = v.match(/\d+/g); if (!n) return null;
  let m, d;
  if (n.length>=3 && n[0].length===4){ m=+n[1]; d=+n[2]; }
  else if (n.length>=2){ m=+n[0]; d=+n[1]; }
  else if (n[0].length===4){ m=+n[0].slice(0,2); d=+n[0].slice(2); }
  else return null;
  if (!(m>=1&&m<=12&&d>=1&&d<=31)) return null;
  return `${pad(m)}-${pad(d)}`;
}
const bdayLabel = b => { const [m,d]=b.split("-").map(Number); return `${m}월 ${d}일`; };
function daysToBday(b){
  if (!b) return null;
  const [m,d] = b.split("-").map(Number), now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let next = new Date(now.getFullYear(), m-1, d); if (next < t0) next = new Date(now.getFullYear()+1, m-1, d);
  return Math.round((next - t0)/86400000);
}
const ddayText = n => n===0 ? "오늘 생일 🎉" : `생일 D-${n}`;
const telDigits = v => String(v||"").replace(/[^\d+]/g,"");
function fmtPhone(v){
  const d = telDigits(v);
  if (/^01\d{8,9}$/.test(d)) return d.length===10 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` : `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
  return String(v||"").trim();
}
function memberInfo(m){
  const parts = [];
  if (m.bday){ const n = daysToBday(m.bday); parts.push(n<=7 ? `<span class="bday-soon">🎂 ${bdayLabel(m.bday)} · ${ddayText(n)}</span>` : `<span>🎂 ${bdayLabel(m.bday)}</span>`); }
  if (m.phone) parts.push(`<button class="tel" data-act="contact" data-id="${m.id}">📞 ${esc(fmtPhone(m.phone))}</button>`);
  return parts.length ? `<div class="info">${parts.join("")}</div>` : "";
}
const nameTag = m => `${esc(m.name)}${m.gender==="m"?`<span class="gender m">남</span>`:m.gender==="f"?`<span class="gender f">여</span>`:""}`;
function memoBlock(m, tools){
  if (!m.memo) return tools ? `<div style="margin-top:6px"><button class="link" data-act="memoEdit" data-id="${m.id}">+ 메모 추가</button></div>` : "";
  return `<div class="memo">${esc(m.memo)}</div>` + (tools ? `<div style="margin-top:4px"><span class="memo-tools"><button class="link" data-act="memoEdit" data-id="${m.id}">메모 수정</button><button class="link danger" data-act="memoDelete" data-id="${m.id}">메모 삭제</button></span></div>` : "");
}
const upcomingBdays = ()=> members().filter(m=>m.bday).map(m=>({...m, dd:daysToBday(m.bday)})).filter(m=>m.dd<=7).sort((a,b)=>a.dd-b.dd);
function birthdayToasts(){
  const key = "simple_bday_seen_" + today();
  const seen = new Set(JSON.parse(localStorage.getItem(key) || "[]"));
  const msgs = [];
  upcomingBdays().forEach(m=>{
    if (![7,3,1,0].includes(m.dd) || seen.has(m.id)) return;
    seen.add(m.id);
    msgs.push(m.dd===0 ? `🎉 오늘은 ${m.name}님 생일이에요!` : `🎂 ${m.name}님 생일이 ${m.dd}일 남았어요 (${bdayLabel(m.bday)})`);
  });
  localStorage.setItem(key, JSON.stringify([...seen]));
  msgs.forEach((msg,i)=> setTimeout(()=>toast(msg, 3200), 600 + i*3600));
}
const $sheetBg = document.getElementById("sheetBg");
$sheetBg.addEventListener("click", e=>{ if (e.target===$sheetBg) $sheetBg.classList.remove("open"); });
const members = ()=> Object.entries(store.members).map(([id,m])=>({id,...m})).sort((a,b)=>a.name.localeCompare(b.name,"ko"));
const events = ()=> Object.entries(store.events).map(([id,e])=>({id,...e,marks:e.marks||{}}))
  .sort((a,b)=> (b.date+(b.time||"")).localeCompare(a.date+(a.time||"")));
const count = (e,v)=> members().filter(m=>e.marks[m.id]===v).length;

/* ---------- 화면 ---------- */
let checkFilter = "all";   // 일정 출석체크 화면: all | o(출석자) | x(결석자)
const reasonOpen = new Set();   // 사유 입력칸을 열어 둔 순원
let tab = "events", openEvent = null, showForm = false, editingMember = null, editingEvent = false;
const $app = document.getElementById("app");

function render(){
  if (CONFIG.PASSCODE && localStorage.getItem("simple_unlocked") !== CONFIG.PASSCODE){
    document.getElementById("hdr").style.display = "none";
    $app.innerHTML = `
      <div class="lock">
        <h1>${esc(CONFIG.GROUP_NAME)}</h1>
        <p>출석체크 비밀번호를 입력해 주세요</p>
        <input id="pass" type="password" inputmode="numeric" autofocus>
        <button class="big" style="margin-top:0" data-act="unlock">열기</button>
      </div>`;
    return;
  }
  document.getElementById("hdr").style.display = "";
  document.getElementById("subtitle").textContent = (DEMO ? "데모 모드 · " : "") + `순원 ${members().length}명`;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  if (tab==="events") $app.innerHTML = openEvent && store.events[openEvent] ? viewCheck() : viewEvents();
  else if (tab==="members") $app.innerHTML = viewMembers();
  else $app.innerHTML = viewStats();
}

function eventForm(e){
  const v = e || { date: today(), time: "19:00", title: "순모임" };
  return `
    <div class="form">
      <div class="grid2">
        <div class="field"><label>날짜</label><input id="f_date" type="date" value="${esc(v.date)}"></div>
        <div class="field"><label>시간 (선택)</label><input id="f_time" type="time" value="${esc(v.time||"")}"></div>
      </div>
      <div class="field"><label>일정 이름</label><input id="f_title" value="${esc(v.title)}" maxlength="20"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1;padding:12px" data-act="${e?"cancelEditEvent":"closeForm"}">취소</button>
        <button class="btn primary" style="flex:2;padding:12px" data-act="${e?"saveEvent":"createEvent"}">${e?"저장":"일정 만들고 출석체크"}</button>
      </div>
    </div>`;
}

function viewEvents(){
  const list = events(), t = today();
  const row = e => { const o=count(e,"o"), x=count(e,"x"), total=members().length, done = total && o+x===total;
    return `<div class="row click" data-act="open" data-id="${e.id}">
      <div><div class="name">${esc(e.title)}</div><div class="sub">${dLabel(e.date)}${e.time?" · "+tLabel(e.time):""}</div></div>
      <div style="text-align:right">${e.date===t?`<span class="pill today">오늘</span> `:""}${done?`<span class="pill done">체크 완료</span>`:""}
        <div class="sub" style="margin-top:4px">출석 ${o} · 결석 ${x}</div></div>
    </div>`; };
  const upcoming = list.filter(e=>e.date>=t).reverse(), past = list.filter(e=>e.date<t);
  return `
    ${showForm ? eventForm() : `<button class="big" data-act="newEvent">+ 일정 추가</button>`}
    ${upcomingBdays().length ? `<div class="bdays"><b>🎂 다가오는 생일 (7일 이내)</b>${upcomingBdays().map(m=>`<div>${esc(m.name)} · ${bdayLabel(m.bday)} · <strong>${m.dd===0?"오늘!":"D-"+m.dd}</strong></div>`).join("")}</div>` : ""}
    ${!members().length ? `<div class="demo">먼저 <b>순원</b> 탭에서 순원을 추가해 주세요.</div>` : ""}
    ${upcoming.length?`<h2>예정·오늘</h2><div class="card">${upcoming.map(row).join("")}</div>`:""}
    ${past.length?`<h2>지난 일정</h2><div class="card">${past.map(row).join("")}</div>`:""}
    ${!list.length?`<div class="empty" style="padding-top:40px">아직 일정이 없어요.<br>모임이 있을 때마다 일정을 추가하고 출석을 체크하세요.</div>`:""}
    ${DEMO?`<div class="demo">지금은 <b>데모 모드</b>예요 (이 기기에만 저장). Firebase 설정값을 넣으면 어느 기기에서든 같은 기록을 볼 수 있어요.</div>`:""}`;
}

function viewCheck(){
  const e = { id:openEvent, ...store.events[openEvent], marks: store.events[openEvent].marks || {} };
  const all = members(), o = count(e,"o"), x = count(e,"x");
  const list = checkFilter==="o" ? all.filter(m=>e.marks[m.id]==="o") : checkFilter==="x" ? all.filter(m=>e.marks[m.id]==="x") : all;
  const fbtn = (v,l,n)=> `<button class="${checkFilter===v?"on":""}" data-act="checkFilter" data-v="${v}">${l} ${n}</button>`;
  return `
    <button class="back" data-act="back">‹ 일정 목록</button>
    ${editingEvent ? eventForm(e) : `
    <div class="evhead">
      <div class="t">${esc(e.title)}</div>
      <div class="sub">${dLabel(e.date)}${e.time?" · "+tLabel(e.time):""}</div>
    </div>`}
    <div class="summary">
      <div class="stat yes"><div class="n">${o}</div><div class="l">출석</div></div>
      <div class="stat no"><div class="n">${x}</div><div class="l">결석</div></div>
      <div class="stat"><div class="n">${all.length-o-x}</div><div class="l">미체크</div></div>
    </div>
    <div class="sorter"><h2>출석체크</h2>${all.length?`<div class="sortbtns">${fbtn("all","전체",all.length)}${fbtn("o","출석",o)}${fbtn("x","결석",x)}</div>`:""}</div>
    ${all.length ? `
    <div class="tools">
      <button class="btn" data-act="restAbsent">남은 사람 모두 결석</button>
      <button class="btn" data-act="copy">카톡용 복사</button>
    </div>
    <div class="card">${list.length ? "" : `<div class="empty">${checkFilter==="o"?"아직 출석한 사람이 없어요.":"결석한 사람이 없어요."}</div>`}${list.map(m=>{ const absent = e.marks[m.id]==="x", reason = (e.reasons||{})[m.id]||""; return `
      <div class="row ${absent?"has-reason":""}">
        <div><div class="name">${nameTag(m)}</div>${memberInfo(m)}${memoBlock(m,false)}</div>
        <div class="marks">
          <button class="mk yes ${e.marks[m.id]==="o"?"on":""}" data-act="mark" data-id="${m.id}" data-v="o">출석</button>
          <button class="mk no ${absent?"on":""}" data-act="mark" data-id="${m.id}" data-v="x">결석</button>
        </div>
      </div>
      ${!absent ? "" : reasonOpen.has(m.id)
        ? `<div class="reason-row"><input data-reason="${m.id}" value="${esc(reason)}" maxlength="60" placeholder="결석 사유 (예: 출장, 아파서)" enterkeyhint="done"></div>`
        : reason
          ? `<div class="reason-row"><div class="reason-text"><span>사유: ${esc(reason)}</span><button class="link" data-act="reasonOpen" data-id="${m.id}">수정</button></div></div>`
          : `<div class="reason-row"><button class="reason-btn" data-act="reasonOpen" data-id="${m.id}">+ 사유 입력</button></div>`}`; }).join("")}</div>` : `<div class="card"><div class="empty">순원이 없어요. 아래에서 바로 추가할 수 있어요.</div></div>`}
    <div class="add">
      <input id="addName" placeholder="순원 추가 (쉼표로 여러 명)" maxlength="60">
      <button class="btn primary" data-act="addMember">추가</button>
    </div>
    <div class="tools" style="margin-top:20px">
      ${editingEvent?"":`<button class="btn" data-act="editEvent">일정 수정</button>`}
      <button class="btn danger" data-act="deleteEvent">일정 삭제</button>
    </div>`;
}

let memberSort = localStorage.getItem("simple_member_sort") || "name";
function attStat(mid, excludeId){
  const evs = events().filter(e=>e.id!==excludeId && e.marks[mid]);
  const n = evs.filter(e=>e.marks[mid]==="o").length;
  return { n, t: evs.length, r: evs.length ? n/evs.length : 0 };
}
function sortedMembers(excludeId){   // excludeId: 체크 중인 일정은 순서 계산에서 빼서, 누를 때마다 줄이 움직이지 않게 함
  const list = members(), st = {}; list.forEach(m=> st[m.id] = attStat(m.id, excludeId));
  if (memberSort==="att") list.sort((a,b)=> st[b.id].n - st[a.id].n || st[b.id].r - st[a.id].r || a.name.localeCompare(b.name,"ko"));
  return { list, st };
}
const sortToggle = ()=> `<div class="sortbtns">
        <button class="${memberSort==="name"?"on":""}" data-act="sortMembers" data-v="name">ㄱㄴㄷ순</button>
        <button class="${memberSort==="att"?"on":""}" data-act="sortMembers" data-v="att">출석순</button>
      </div>`;
function viewMembers(){
  const { list, st } = sortedMembers();
  return `
    <div class="add">
      <input id="addName" placeholder="이름 (쉼표로 여러 명: 홍길동, 김하늘)" maxlength="60">
      <button class="btn primary" data-act="addMember">추가</button>
    </div>
    <div class="sorter">
      <h2>순원 ${list.length}명</h2>
      ${sortToggle()}
    </div>
    <div class="card">${list.map(m=> editingMember===m.id ? `
      <div style="padding:12px 0;border-bottom:1px solid var(--line)">
        <div class="field"><label>이름 · 성별</label>
          <div style="display:flex;gap:6px">
            <input id="eName" value="${esc(m.name)}" maxlength="12" style="flex:1">
            <div class="seg" id="eGender" data-v="${m.gender||""}" style="flex:0 0 112px">
              <button type="button" class="${m.gender==="m"?"on":""}" data-act="pickGender" data-v="m">남</button>
              <button type="button" class="${m.gender==="f"?"on":""}" data-act="pickGender" data-v="f">여</button>
            </div>
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label>생일 (예: 3/14)</label><input id="eBday" value="${m.bday?esc(m.bday.replace("-","/")):""}" inputmode="numeric" placeholder="월/일"></div>
          <div class="field"><label>전화번호</label><input id="ePhone" type="tel" value="${esc(m.phone||"")}" placeholder="010-0000-0000"></div>
        </div>
        <div class="field"><label>메모</label><textarea id="eMemo" class="memo-in" maxlength="300" placeholder="기도제목, 근황 등">${esc(m.memo||"")}</textarea></div>
        <div style="display:flex;gap:8px">
          <button class="btn" style="flex:1" data-act="cancelMember">취소</button>
          <button class="btn primary" style="flex:2" data-act="saveMember" data-id="${m.id}">저장</button>
        </div>
      </div>` : `
      <div class="row">
        <div style="min-width:0;flex:1"><div class="name">${nameTag(m)}${st[m.id].t?`<span class="attcount">출석 ${st[m.id].n}/${st[m.id].t}</span>`:""}</div>${memberInfo(m)}${memoBlock(m,true)}</div>
        <div class="marks">
          <button class="btn" data-act="editMember" data-id="${m.id}">수정</button>
          <button class="btn danger" data-act="deleteMember" data-id="${m.id}">삭제</button>
        </div>
      </div>`).join("") || `<div class="empty">아직 순원이 없어요.</div>`}</div>`;
}

function viewStats(){
  const evs = events().filter(e=>Object.keys(e.marks).length), { list } = sortedMembers();
  if (!evs.length) return `<div class="empty" style="padding-top:60px">아직 체크한 일정이 없어요.</div>`;
  const stat = m => { const n = evs.filter(e=>e.marks[m.id]==="o").length, t = evs.filter(e=>e.marks[m.id]).length;
    return { n, t, r: t?Math.round(n/t*100):0 }; };
  const avg = Math.round(evs.reduce((a,e)=>a+count(e,"o"),0)/evs.length*10)/10;
  return `
    <div class="summary">
      <div class="stat"><div class="n">${evs.length}</div><div class="l">체크한 일정</div></div>
      <div class="stat yes"><div class="n">${avg}</div><div class="l">평균 출석 인원</div></div>
      <div class="stat"><div class="n">${list.length}</div><div class="l">순원</div></div>
    </div>
    <div class="sorter"><h2>순원별 출석률</h2>${sortToggle()}</div>
    <div class="card">${list.map(m=>{ const s=stat(m); return `
      <div class="row" style="display:block">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="name" style="font-size:15px">${esc(m.name)}</span><span class="sub">${s.n}/${s.t} · ${s.r}%</span>
        </div>
        <div class="bar"><i style="width:${s.r}%"></i></div>
      </div>`; }).join("")}</div>
    <h2>일정별 출석</h2>
    <div class="card">${evs.map(e=>`
      <div class="row click" data-act="open" data-id="${e.id}">
        <div><div class="name" style="font-size:15px">${esc(e.title)}</div><div class="sub">${dLabel(e.date)}</div></div>
        <div class="sub">출석 ${count(e,"o")} · 결석 ${count(e,"x")}</div>
      </div>`).join("")}</div>`;
}

/* ---------- 동작 ---------- */
async function addMembers(){
  const input = document.getElementById("addName");
  const names = input.value.split(/[,，\n]/).map(clean).filter(Boolean);
  if (!names.length) return toast("이름을 입력해 주세요");
  const exists = new Set(members().map(m=>m.name));
  let added = 0;
  for (const n of names){ if (exists.has(n)) continue; exists.add(n); await put("simple_members","members", newId("m_"), { name:n, createdAt:Date.now() }); added++; }
  toast(added ? `${added}명 추가했어요` : "이미 있는 이름이에요");
  document.getElementById("addName")?.focus();
}
function readEventForm(){
  const date = document.getElementById("f_date").value, title = clean(document.getElementById("f_title").value);
  if (!date || !title) { toast("날짜와 일정 이름을 입력해 주세요"); return null; }
  return { date, time: document.getElementById("f_time").value, title };
}

document.addEventListener("click", async ev=>{
  const t = ev.target.closest("[data-tab]");
  if (t){ tab=t.dataset.tab; openEvent=null; showForm=false; editingMember=null; editingEvent=false; render(); window.scrollTo(0,0); return; }
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const { act, id, v } = b.dataset;
  try{
    switch(act){
      case "unlock": {
        if (document.getElementById("pass").value !== CONFIG.PASSCODE) return toast("비밀번호가 맞지 않아요");
        localStorage.setItem("simple_unlocked", CONFIG.PASSCODE); render(); return birthdayToasts();
      }
      case "newEvent": showForm=true; return render();
      case "closeForm": showForm=false; return render();
      case "createEvent": {
        const data = readEventForm(); if (!data) return;
        const eid = newId("e_"); showForm=false; openEvent=eid; checkFilter="all";
        await put("simple_events","events", eid, { ...data, marks:{}, createdAt:Date.now() });
        window.scrollTo(0,0); return toast("일정을 만들었어요");
      }
      case "checkFilter": checkFilter=v; return render();
      case "open": checkFilter="all"; openEvent=id; tab="events"; editingEvent=false; render(); return window.scrollTo(0,0);
      case "back": openEvent=null; editingEvent=false; reasonOpen.clear(); return render();
      case "editEvent": editingEvent=true; return render();
      case "cancelEditEvent": editingEvent=false; return render();
      case "saveEvent": { const data = readEventForm(); if (!data) return; editingEvent=false; await put("simple_events","events", openEvent, data); return toast("저장했어요"); }
      case "deleteEvent": {
        if (!confirm("이 일정과 출석 기록을 삭제할까요?")) return;
        const eid = openEvent; openEvent=null; editingEvent=false; await drop("simple_events","events", eid); return toast("삭제했어요");
      }
      case "mark": {
        const cur = (store.events[openEvent].marks||{})[id], next = cur===v ? null : v;
        if (next!=="x"){ reasonOpen.delete(id); if ((store.events[openEvent].reasons||{})[id]) await setReason(openEvent, id, ""); }
        return setMark(openEvent, id, next);
      }
      case "restAbsent": {
        const marks = store.events[openEvent].marks || {}, rest = members().filter(m=>!marks[m.id]);
        if (!rest.length) return toast("남은 사람이 없어요");
        for (const m of rest) await setMark(openEvent, m.id, "x", true);
        render(); return toast(`${rest.length}명을 결석으로 체크했어요`);
      }
      case "copy": {
        const e = store.events[openEvent], marks = e.marks || {}, list = members();
        const rs = e.reasons || {};
        const yes = list.filter(m=>marks[m.id]==="o").map(m=>m.name), no = list.filter(m=>marks[m.id]==="x").map(m=> rs[m.id] ? `${m.name}(${rs[m.id]})` : m.name);
        const text = `[${CONFIG.GROUP_NAME}] ${dLabel(e.date)} ${e.title}\n출석 ${yes.length}명: ${yes.join(", ")||"-"}\n결석 ${no.length}명: ${no.join(", ")||"-"}`;
        if (navigator.share){ try{ await navigator.share({ text }); return; }catch(_){ } }
        await navigator.clipboard.writeText(text); return toast("복사했어요. 단톡방에 붙여넣으세요");
      }
      case "addMember": return addMembers();
      case "editMember": editingMember=id; return render();
      case "saveMember": {
        const name = clean(document.getElementById("eName").value); if(!name) return toast("이름을 입력해 주세요");
        const bday = parseBday(document.getElementById("eBday").value);
        if (bday===null) return toast("생일은 3/14처럼 월/일로 적어 주세요");
        const phone = fmtPhone(document.getElementById("ePhone").value);
        const gender = document.getElementById("eGender").dataset.v || "";
        const memo = document.getElementById("eMemo").value.trim();
        editingMember=null; await put("simple_members","members", id, { name, bday, phone, gender, memo }); return toast("저장했어요");
      }
      case "cancelMember": editingMember=null; return render();
      case "sortMembers": memberSort=v; localStorage.setItem("simple_member_sort", v); return render();
      case "reasonOpen": { reasonOpen.add(id); render(); const i=document.querySelector(`[data-reason="${id}"]`); if (i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } return; }
      case "pickGender": { const g=document.getElementById("eGender"); const nv = g.dataset.v===v ? "" : v;   // 같은 버튼을 다시 누르면 선택 해제
        g.dataset.v=nv; g.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x.dataset.v===nv)); return; }
      case "memoEdit": { editingMember=id; tab="members"; render(); const t=document.getElementById("eMemo"); if (t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); t.scrollIntoView({block:"center"}); } return; }
      case "memoDelete": { if (!confirm(`${store.members[id].name}님 메모를 지울까요?`)) return; await put("simple_members","members", id, { memo:"" }); return toast("메모를 지웠어요"); }
      case "contact": {
        const m = store.members[id], num = telDigits(m.phone);
        document.getElementById("sheet").innerHTML = `
          <div style="text-align:center;font-weight:800;font-size:18px">${esc(m.name)}</div>
          <div style="text-align:center;color:var(--sub);margin:4px 0 16px">${esc(fmtPhone(m.phone))}</div>
          <a href="tel:${num}">📞 전화 걸기</a>
          <a href="sms:${num}">💬 문자 보내기</a>
          <a href="#" data-act="closeSheet" style="color:var(--sub)">닫기</a>`;
        $sheetBg.classList.add("open"); return;
      }
      case "closeSheet": ev.preventDefault(); $sheetBg.classList.remove("open"); return;
      case "deleteMember": {
        if (!confirm(`${store.members[id].name}님을 순원 명단에서 지울까요? 지난 출석 기록에서도 빠져요.`)) return;
        await drop("simple_members","members", id); return toast("지웠어요");
      }
    }
  }catch(e){ console.error(e); toast("저장 중 오류가 났어요"); }
});
document.addEventListener("change", async e=>{
  const mid = e.target.dataset && e.target.dataset.reason;
  if (!mid || !openEvent) return;
  try { const v = clean(e.target.value); reasonOpen.delete(mid); await setReason(openEvent, mid, v); render(); if (v) toast("결석 사유를 저장했어요"); }
  catch(err){ console.error(err); toast("저장 중 오류가 났어요"); }
});
document.addEventListener("keydown", e=>{
  if (e.key!=="Enter") return;
  if (e.target.dataset && e.target.dataset.reason){ e.target.blur(); return; }
  if (e.target.id==="addName") addMembers();
  if (["eName","eBday","ePhone"].includes(e.target.id)) document.querySelector('[data-act="saveMember"]')?.click();
  if (e.target.id==="pass") document.querySelector('[data-act="unlock"]')?.click();
});

await initData();
ready = true;
render();
if (!CONFIG.PASSCODE || localStorage.getItem("simple_unlocked") === CONFIG.PASSCODE) birthdayToasts();
</script>
</body>
</html>
