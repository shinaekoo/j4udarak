<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J4U 순모임 출석부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1f2328; --sub:#6b7078; --line:#e7e3da;
    --accent:#2f6b4f; --accent-soft:#e3efe8; --no:#b4483c; --no-soft:#f6e3e0;
    --kakao:#FEE500; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 96px}
  header{position:sticky;top:0;z-index:5;background:rgba(246,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hbar{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .brand{font-weight:800;font-size:19px;letter-spacing:-.3px}
  .brand small{display:block;font-weight:500;font-size:12px;color:var(--sub);letter-spacing:0}
  .me{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;color:var(--ink)}
  .avatar{width:34px;height:34px;border-radius:50%;background:#ddd center/cover;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
  .tabs{max-width:560px;margin:0 auto;display:flex;gap:4px;padding:0 12px 10px}
  .tab{flex:1;border:0;background:transparent;padding:9px 0;border-radius:10px;color:var(--sub);font-weight:600}
  .tab.on{background:var(--ink);color:#fff}
  h2{font-size:15px;color:var(--sub);font-weight:700;margin:24px 4px 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .card.today{border:2px solid var(--accent)}
  .card.cancelled{opacity:.55}
  .ev-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ev-date{font-size:20px;font-weight:800;letter-spacing:-.4px}
  .ev-meta{color:var(--sub);font-size:14px;margin-top:2px}
  .badge{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
  .b-today{background:var(--accent);color:#fff}
  .b-special{background:#f3e6c4;color:#7a5a12}
  .b-cancel{background:#eee;color:#777}
  .counts{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
  .chip{border:0;background:#f1efe9;border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink)}
  .chip b{margin-left:3px}
  .chip.yes{background:var(--accent-soft);color:var(--accent)}
  .chip.no{background:var(--no-soft);color:var(--no)}
  .names{font-size:13px;color:var(--sub);line-height:1.7;margin:6px 2px 0;display:none}
  .names.open{display:block}
  .names strong{color:var(--ink);font-weight:600}
  .rsvp{display:flex;gap:8px;margin-top:14px}
  .rbtn{flex:1;padding:12px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--sub)}
  .rbtn.yes.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .rbtn.no.on{background:var(--no);border-color:var(--no);color:#fff}
  .reason{display:flex;gap:6px;margin-top:8px}
  .reason input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfaf7}
  .reason button{white-space:nowrap;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:0 14px;font-weight:600}
  .checkin{width:100%;margin-top:12px;padding:15px 0;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:16px}
  .checkin.done{background:var(--accent-soft);color:var(--accent)}
  .admin-row{display:flex;gap:6px;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .sbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink)}
  .sbtn.danger{color:var(--no)}
  .sbtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
  .stat .n{font-size:22px;font-weight:800}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .t{font-weight:700}
  .row .s{font-size:13px;color:var(--sub)}
  .pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#f1efe9;color:var(--sub);white-space:nowrap}
  .pill.yes{background:var(--accent-soft);color:var(--accent)}
  .pill.no{background:var(--no-soft);color:var(--no)}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .field label{font-size:13px;color:var(--sub);font-weight:600}
  .field input,.field select{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fbfaf7}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .empty{text-align:center;color:var(--sub);padding:28px 0;font-size:14px}
  /* login */
  .login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
  .login h1{font-size:28px;margin:0 0 8px;letter-spacing:-.6px}
  .login p{color:var(--sub);margin:0 0 32px;line-height:1.6}
  .kakao{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:320px;background:var(--kakao);color:#191919;border:0;border-radius:12px;padding:15px 0;font-weight:700;font-size:16px}
  .demo-note{margin-top:18px;font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:320px;line-height:1.5}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{background:var(--bg);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px 32px}
  .modal h3{margin:0 0 4px;font-size:18px}
  .att-btns{display:flex;gap:4px}
  .att-btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--sub)}
  .att-btns .a-yes.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .att-btns .a-no.on{background:var(--no);color:#fff;border-color:var(--no)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;padding:80px 0;color:var(--sub)}

  .filter{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 2px;scrollbar-width:none}
  .filter button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--sub)}
  .filter button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .role{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#f3e6c4;color:#7a5a12;margin-left:6px;vertical-align:2px}
  .grp{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 2px}
  .mini{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fbfaf7;font-size:13px}
  .soon-pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:8px;font-weight:700;font-size:16px}
  .breakdown{font-size:12px;color:var(--sub);margin-top:4px}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* =========================================================
   ① 설정 — 여기만 채우면 됩니다
   ========================================================= */
const CONFIG = {
  GROUP_NAME: "J4U 순모임",
  // 카카오 개발자센터 > 내 애플리케이션 > 앱 키 > "REST API 키"
  KAKAO_REST_KEY: "eaaf7e5dfc99217b7201ea326b81981f",
    KAKAO_CLIENT_SECRET: "wPJCeNvvjc2irl1QT6qeM1Gxwu0rL2At",
  // Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹) > SDK 설정
  FIREBASE: {
    apiKey: "AIzaSyAmv1pHlLahYythXiT15cGqlEnHJEtg9e0",
    authDomain: "darak-attendance.firebaseapp.com",
  projectId: "darak-attendance",
  storageBucket: "darak-attendance.firebasestorage.app",
  messagingSenderId: "956597071783",
  appId: "1:956597071783:web:68c888e812316699769082",
  measurementId: "G-4YQZCZ2FPD"
  },
  // 처음 다락방장 카카오 회원번호 (로그인 후 프로필 메뉴에서 확인).
  // 이후 다락방장·순장 지정은 '설정' 탭에서 할 수 있어요.
  ADMIN_IDS: ["0000000000"],
  // 리더 비밀번호: 순장·다락방장으로 가입할 때 넣는 비밀번호 (꼭 바꾸세요)
  DARAK_PASSWORD: "1234",
  // 정기 모임 기본값 (설정 탭에서 바꿀 수 있음) 0=일 … 6=토
  DEFAULT_REGULAR: { weekday: 6, time: "19:00", title: "다락방 모임" },
  START_DATE: "2026-11-12",   // 이 날짜 이전 정기 모임은 만들지 않아요 (설정 탭에서 바꿀 수 있음)
  PAST_WEEKS: 12,   // 지난 기록에 보여줄 기간
  AHEAD_WEEKS: 8    // 다가오는 모임에 보여줄 기간
};
/* ========================================================= */

const DEMO = CONFIG.KAKAO_REST_KEY.startsWith("YOUR_") || CONFIG.FIREBASE.apiKey.startsWith("YOUR_");
const REDIRECT_URI = location.origin + location.pathname;
const WD = ["일","월","화","수","목","금","토"];
const NO_LABEL = "참석 어려워요";

/* ---------- 데이터 저장소 ---------- */
const store = { members:{}, responses:{}, events:{}, soons:{}, notices:{}, settings:null };
let db = null;

async function initData(onChange){
  if (DEMO){
    const saved = JSON.parse(localStorage.getItem("att_demo2") || "null");
    if (saved) Object.assign(store, saved); else seedDemo();
    onChange();
    return;
  }
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  db = { fs, ref: fs.getFirestore(initializeApp(CONFIG.FIREBASE)) };
  // 처음 데이터가 다 들어올 때까지 기다림 (기존 가입자를 신규로 착각하지 않도록)
  const firsts = ["members","responses","events","soons","notices"].map(col=> new Promise(res=>{
    fs.onSnapshot(fs.collection(db.ref, col), snap=>{
      const m = {}; snap.forEach(d=>m[d.id]=d.data()); store[col]=m; res(); onChange();
    }, err=>{ console.error(err); res(); });
  }));
  firsts.push(new Promise(res=> fs.onSnapshot(fs.doc(db.ref,"config","settings"), d=>{ store.settings = d.exists()? d.data() : null; res(); onChange(); }, err=>{ console.error(err); res(); })));
  await Promise.all(firsts);
}
async function save(col, id, data){
  if (col==="config"){ store.settings = {...(store.settings||{}), ...data}; }
  else store[col][id] = {...(store[col][id]||{}), ...data};
  if (DEMO){ persistDemo(); render(); return; }
  const { fs, ref } = db;
  await fs.setDoc(fs.doc(ref, col, id), data, { merge:true });
}
async function remove(col, id){
  delete store[col][id];
  if (DEMO){ persistDemo(); render(); return; }
  const { fs, ref } = db;
  await fs.deleteDoc(fs.doc(ref, col, id));
}
function persistDemo(){ localStorage.setItem("att_demo2", JSON.stringify(store)); }
function seedDemo(){
  const soons = { s1:["김하늘","이도윤","박서연","최민준","정지우"], s2:["한예린","오세훈","윤지아","장민서"], s3:["임태양","서다은","강준호","노유나","문가람"] };
  Object.entries(soons).forEach(([sid,names],i)=> store.soons[sid] = { name:`${names[0]} 순`, leaderName:names[0], leaderUid:`${sid}_0`, order:i });
  Object.entries(soons).forEach(([sid,names])=> names.forEach((n,i)=>{
    store.members[`${sid}_${i}`] = { name:n, nickname:n, image:"", soonId:sid, role: i===0?"soon":"member" };
  }));
  store.members.demo_me = { name:"나(데모)", nickname:"나(데모)", image:"", soonId:"s1", role:"darak" };
  store.notices.n1 = { authorId:"demo_me", audience:"leaders", text:"순장님들, 이번 주 모임 전에 순원들 기도제목 한 번씩 확인 부탁드려요.", createdAt:Date.now()-3600e3 };
  store.notices.n2 = { authorId:"s1_0", audience:"soon", soonId:"s1", text:"1순 이번 주는 모임 끝나고 같이 식사해요! 못 오시는 분은 미리 알려주세요 🙂", createdAt:Date.now()-7200e3 };
  const evs = buildEvents();
  Object.keys(store.members).forEach(uid=>{
    if (uid==="demo_me") return;
    evs.forEach(e=>{
      const r = Math.random();
      const rec = { eventId:e.id, uid, rsvp: r<.65?"yes":r<.85?"no":null, updatedAt:Date.now() };
      if (rec.rsvp==="no" && Math.random()<.5) rec.reason = ["출장","가족 일정","몸이 안 좋아요"][Math.floor(Math.random()*3)];
      if (e.date < todayStr()) rec.attended = rec.rsvp==="yes" ? Math.random()<.9 : Math.random()<.15;
      if (rec.rsvp || rec.attended!=null) store.responses[e.id+"__"+uid] = rec;
    });
  });
}

/* ---------- 날짜 ---------- */
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = ()=>ymd(new Date());
const parse = s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
function fmtDate(s){ const d=parse(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; }
function fmtTime(t){ if(!t) return ""; let [h,m]=t.split(":").map(Number); const ap=h<12?"오전":"오후"; h=h%12||12; return `${ap} ${h}:${pad(m)}`; }

/* ---------- 모임 목록 ---------- */
function settings(){ return { ...CONFIG.DEFAULT_REGULAR, startDate: CONFIG.START_DATE, cancelled:[], ...(store.settings||{}) }; }
function buildEvents({ includeCancelled=false } = {}){
  const s = settings(), list = [];
  let start = new Date(); start.setDate(start.getDate() - CONFIG.PAST_WEEKS*7);
  if (s.startDate && parse(s.startDate) > start) start = parse(s.startDate);
  const end = new Date(); end.setDate(end.getDate() + CONFIG.AHEAD_WEEKS*7);
  if (s.weekday != null && Number(s.weekday) >= 0){
    const d = new Date(start);
    while (d.getDay() !== Number(s.weekday)) d.setDate(d.getDate()+1);
    for (; d <= end; d.setDate(d.getDate()+7)){
      const date = ymd(d), cancelled = (s.cancelled||[]).includes(date);
      if (cancelled && !includeCancelled) continue;
      list.push({ id:"reg_"+date, date, time:s.time, title:s.title, type:"regular", cancelled });
    }
  }
  Object.entries(store.events).forEach(([id,e])=>{
    if (e.soonId && user && !isDarak() && e.soonId!==mySoon()) return;   // 다른 순의 순 모임은 숨김
    list.push({ id, ...e, type: e.soonId ? "soon" : "special" });
  });
  return list.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
}
const resp = (eid, uid)=> store.responses[eid+"__"+uid] || {};
const forEv = (e, uid)=> !e.soonId || store.members[uid]?.soonId===e.soonId;   // 이 모임 대상자인가
const memberName = uid => { const m=store.members[uid]; return m ? (m.name || m.nickname || "멤버") : "멤버"; };

/* ---------- 다락방 · 순 · 권한 ---------- */
const soonList = ()=> Object.entries(store.soons).map(([id,s])=>({id,...s})).sort((a,b)=>(a.order??0)-(b.order??0) || a.name.localeCompare(b.name,"ko"));
const soonName = sid => sid && store.soons[sid] ? store.soons[sid].name : "순 미배정";
const byName = (a,b)=> memberName(a).localeCompare(memberName(b),"ko");
const inGroup = u => !(store.members[u].role==="darak" && !store.soons[store.members[u].soonId]);
const membersOf = sid => Object.keys(store.members).filter(inGroup).filter(u => sid==="none" ? !store.soons[store.members[u].soonId] : store.members[u].soonId===sid).sort(byName);
const isDarak = (uid=user?.id)=> !!uid && ((!DEMO && CONFIG.ADMIN_IDS.includes(uid)) || store.members[uid]?.role==="darak");
const isSoonjang = (uid=user?.id)=> !!uid && store.members[uid]?.role==="soon" && !!store.soons[store.members[uid]?.soonId];
const mySoon = ()=> store.members[user.id]?.soonId;
const canManage = ()=> isDarak() || isSoonjang();
const canCancel = e => isDarak() || (e.soonId && isSoonjang() && e.soonId===mySoon());
// 내가 볼 수 있는 멤버 범위
function scopeUids(filter){
  if (isDarak()){
    if (!filter || filter==="all") return Object.keys(store.members).filter(inGroup).sort(byName);
    return membersOf(filter);
  }
  const s = mySoon();
  return store.soons[s] ? membersOf(s) : [user.id];
}
// 출석을 고칠 수 있는가
const canMark = uid => isDarak() || (isSoonjang() && store.members[uid]?.soonId===mySoon());
/* 공지: 다락방장 → 순장 전체(leaders) 또는 다락방 전체(all), 순장 → 자기 순(soon) */
function canSeeNotice(n){
  if (n.authorId===user.id || isDarak()) return true;
  if (n.audience==="all") return true;
  if (n.audience==="leaders") return isSoonjang();
  if (n.audience==="soon") return n.soonId===mySoon();
  return false;
}
const visibleNotices = ()=> Object.entries(store.notices).map(([id,n])=>({id,...n})).filter(canSeeNotice).sort((a,b)=>b.createdAt-a.createdAt);
function audienceLabel(n){
  if (n.audience==="leaders") return "순장 전체";
  if (n.audience==="all") return "다락방 전체";
  return soonName(n.soonId) + " 전체";
}
function fmtAgo(t){
  const m = Math.floor((Date.now()-t)/60000);
  if (m<1) return "방금"; if (m<60) return `${m}분 전`;
  const h = Math.floor(m/60); if (h<24) return `${h}시간 전`;
  const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()}`;
}
const lastSeenKey = ()=> "att_notice_seen_"+user.id;
let showAllNotices = false;
function noticeBlock(){
  const list = visibleNotices();
  const canWrite = isDarak() || isSoonjang();
  if (!list.length && !canWrite) return "";
  const seen = Number(localStorage.getItem(lastSeenKey())||0);
  const shown = showAllNotices ? list : list.slice(0,2);
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:24px 4px 10px">
      <h2 style="margin:0">공지${list.some(n=>n.createdAt>seen && n.authorId!==user.id)?` <span class="badge b-today" style="font-size:11px">새 공지</span>`:""}</h2>
      ${canWrite?`<button class="sbtn primary" data-act="writeNotice">공지 쓰기</button>`:""}
    </div>
    ${shown.map(n=>`
      <div class="card" style="padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">

/* ---------- 카카오 로그인 ---------- */
let user = null;
async function initAuth(){
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  if (code && !DEMO){
    history.replaceState(null, "", location.pathname);
    try{
      const tok = await fetch("https://kauth.kakao.com/oauth/token", {
        method:"POST",
        headers:{ "Content-Type":"application/x-www-form-urlencoded;charset=utf-8" },
        body:new URLSearchParams({ grant_type:"authorization_code", client_id:CONFIG.KAKAO_REST_KEY, redirect_uri:REDIRECT_URI, code, ...(CONFIG.KAKAO_CLIENT_SECRET ? { client_secret:CONFIG.KAKAO_CLIENT_SECRET } : {}) })
      }).then(r=>r.json());
      if (!tok.access_token) throw new Error(tok.error_description || "토큰 발급 실패");
      const me = await fetch("https://kapi.kakao.com/v2/user/me", { headers:{ Authorization:"Bearer "+tok.access_token } }).then(r=>r.json());
      const p = (me.kakao_account && me.kakao_account.profile) || {};
      user = { id:String(me.id), nickname: p.nickname || (me.properties||{}).nickname || "멤버", image: p.thumbnail_image_url || (me.properties||{}).thumbnail_image || "" };
      localStorage.setItem("att_user", JSON.stringify(user));
    }catch(e){ alert("카카오 로그인에 실패했어요: " + e.message); }
  } else {
    user = JSON.parse(localStorage.getItem(DEMO ? "att_demo2_user" : "att_user") || "null");
  }
}
function login(){
  if (DEMO){
    user = { id:"demo_me", nickname:"나(데모)", image:"" };
    localStorage.setItem("att_demo2_user", JSON.stringify(user));
    afterLogin(); return;
  }
  // 로그아웃한 뒤에는 카카오 로그인 화면을 다시 띄워서 다른 계정으로 들어갈 수 있게 함
  const force = localStorage.getItem("att_force_login")==="1";
  localStorage.removeItem("att_force_login");
  location.href = `https://kauth.kakao.com/oauth/authorize?client_id=${CONFIG.KAKAO_REST_KEY}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code${force?"&prompt=login":""}`;
}
function logout(){
  localStorage.removeItem(DEMO ? "att_demo2_user" : "att_user");
  localStorage.setItem("att_force_login","1");
  sessionStorage.removeItem("att_join_later");
  user = null; closeModal(); render();
}
async function afterLogin(){
  const m = store.members[user.id];
  if (!m) await save("members", user.id, { nickname:user.nickname, name:user.nickname, image:user.image, joinedAt:Date.now() });
  else if (m.image !== user.image || m.nickname !== user.nickname) await save("members", user.id, { nickname:user.nickname, image:user.image });
  render();
  maybeAskSoon();
}
const clean = v => String(v||"").trim().replace(/\s+/g," ");

async function joinGo(){
  const name = clean(document.getElementById("j_name").value);
  joinDraft = name; joinError = "";
  if (!name){ joinError = "이름을 입력해 주세요"; return maybeAskSoon(true); }
  if (joinMode==="darak"){
    const pw = document.getElementById("j_pw").value;
    if (!CONFIG.DARAK_PASSWORD || pw !== CONFIG.DARAK_PASSWORD){ joinError = "비밀번호가 맞지 않아요"; return maybeAskSoon(true); }
    await save("members", user.id, { name, role:"darak", soonId:null });
    closeModal(); toast("다락방장으로 등록했어요"); return render();
  }
  if (joinMode==="soon"){
    const pw = document.getElementById("j_pw").value;
    if (!CONFIG.DARAK_PASSWORD || pw !== CONFIG.DARAK_PASSWORD){ joinError = "비밀번호가 맞지 않아요"; return maybeAskSoon(true); }
  }
  const leader = joinMode==="soon" ? name : clean(document.getElementById("j_leader").value);
  if (!leader){ joinError = "순장 이름을 입력해 주세요"; return maybeAskSoon(true); }
  let soon = soonList().find(x=> clean(x.leaderName)===leader);
  let role = "member";
  if (joinMode==="soon"){
    if (soon && soon.leaderUid && soon.leaderUid!==user.id){ joinError = `'${leader} 순'에는 이미 순장이 등록되어 있어요. 이름을 확인해 주세요.`; return maybeAskSoon(true); }
    if (!soon){
      const sid = "soon_"+Date.now();
      await save("soons", sid, { name:`${leader} 순`, leaderName:leader, leaderUid:user.id, order:soonList().length });
      soon = { id:sid };
    } else await save("soons", soon.id, { leaderUid:user.id });
    role = "soon";
  } else if (!soon){
    const sid = "soon_"+Date.now();
    await save("soons", sid, { name:`${leader} 순`, leaderName:leader, leaderUid:null, order:soonList().length });
    soon = { id:sid };
  }
  await save("members", user.id, { name, soonId:soon.id, role });
  closeModal(); toast(role==="soon" ? `${soonName(soon.id)} 순장으로 등록했어요` : `${soonName(soon.id)}으로 등록했어요`); render();
}

function pastEvents(){ const t=todayStr(); return buildEvents().filter(e=>e.date<=t); }
function statsFor(uid){
  const past = pastEvents().filter(e=> forEv(e,uid) && (e.date<todayStr() || resp(e.id,uid).attended!=null));
  const att = past.filter(e=>resp(e.id,uid).attended===true).length;
  const answered = buildEvents().filter(e=>resp(e.id,uid).rsvp).length;
  return { total:past.length, att, rate: past.length? Math.round(att/past.length*100) : 0, answered };
}

function viewManage(){
  const uids = scopeUids(soonFilter);
  const recent = pastEvents().reverse().slice(0,8);
  const rate = list => { let a=0,t=0; list.forEach(u=>{ const s=statsFor(u); a+=s.att; t+=s.total; }); return t? Math.round(a/t*100):0; };
  const showBreakdown = isDarak() && soonFilter==="all";
  const myS = settings();
  const createCard = isSoonjang() ? `
    <h2>${esc(soonName(mySoon()))} 모임 만들기</h2>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>날짜</label><input id="so_date" type="date" min="${todayStr()}"></div>
        <div class="field"><label>시간</label><input id="so_time" type="time" value="${esc(myS.time)}"></div>
      </div>
      <div class="field"><label>모임 이름</label><input id="so_title" placeholder="예: 순모임, 순 나들이"></div>
      <div class="field"><label>장소 (선택)</label><input id="so_place" placeholder="예: 카페, 교회 2층"></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px"><input id="so_weekly" type="checkbox"> 같은 요일·시간으로 4주 동안 만들기</label>
      <div class="ev-meta" style="font-size:12px;margin:-4px 0 12px">우리 순 사람들에게만 보여요.</div>
      <button class="sbtn primary" data-act="addSoonEvent">만들기</button>
    </div>` : "";
  return createCard + soonFilterBar() + `
    <h2>${esc(scopeTitle())} · 최근 ${CONFIG.PAST_WEEKS}주</h2>
    <div class="stats">
      <div class="stat"><div class="n">${uids.length}</div><div class="l">인원</div></div>
      <div class="stat"><div class="n">${rate(uids)}%</div><div class="l">평균 출석률</div></div>
      <div class="stat"><div class="n">${recent[0]? uids.filter(u=>resp(recent[0].id,u).attended===true).length : 0}</div><div class="l">최근 모임 출석</div></div>
    </div>
    ${showBreakdown?`
    <h2>순별 출석률</h2>
    <div class="card" style="padding:4px 16px">
      ${soonList().map(s=>{ const l=membersOf(s.id); const r=rate(l); const leaders=l.filter(u=>isSoonjang(u)).map(memberName).join(", ");
        return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span class="t">${esc(s.name)} <span class="s" style="font-weight:500">${leaders?"순장 "+esc(leaders)+" · ":""}${l.length}명</span></span><span class="s">${r}%</span></div><div class="bar"><i style="width:${r}%"></i></div></div>`;
      }).join("") || `<div class="empty">설정 탭에서 순을 만들어 주세요.</div>`}
    </div>`:""}
    <h2>모임별 출석</h2>
    <div class="card" style="padding:4px 16px">
      ${recent.map(e=>{
        const eu = uids.filter(u=>forEv(e,u)); const n = eu.filter(u=>resp(e.id,u).attended===true).length;
        const bd = showBreakdown && !e.soonId ? `<div class="breakdown">${soonList().map(s=>{ const l=membersOf(s.id); return `${esc(s.name)} ${l.filter(u=>resp(e.id,u).attended===true).length}/${l.length}`; }).join(" · ")}</div>` : "";
        return `<div class="row"><div><div class="t">${fmtDate(e.date)}${e.date===todayStr()?` <span class="pill yes">오늘</span>`:""}</div><div class="s">${esc(e.title)}${e.type==="soon"?" · 순 모임":""} · 출석 ${n}/${eu.length}</div>${bd}</div>
          <button class="sbtn" data-act="roster" data-id="${e.id}">출석부</button></div>`;
      }).join("") || `<div class="empty">아직 지난 모임이 없어요.</div>`}
    </div>
    <h2>멤버별 출석률</h2>
    <div class="card" style="padding:4px 16px">
      ${uids.map(u=>{ const st=statsFor(u); const rl=roleLabel(u); return `
        <div class="row" style="display:block">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="display:flex;align-items:center;gap:8px">${avatar(u,28)}<span class="t">${esc(memberName(u))}${rl?`<span class="role">${rl}</span>`:""}</span>${showBreakdown?`<span class="s">${esc(soonName(store.members[u].soonId))}</span>`:""}</div>
            <span class="s">${st.att}/${st.total} · ${st.rate}%</span>
          </div>
          <div class="bar"><i style="width:${st.rate}%"></i></div>
        </div>`; }).join("") || `<div class="empty">아직 멤버가 없어요.</div>`}
    </div>`;
}

  const soons = soonList();
  const groups = [...soons.map(x=>[x.name, membersOf(x.id)]), ["순 미배정", membersOf("none")]].filter(([,l])=>l.length);
  return `
    <h2>순 관리</h2>
    <div class="card" style="padding:4px 16px 16px">
      ${soons.map(x=>`
        <div class="row">
          <div><div class="t">${esc(x.name)}</div><div class="s">${membersOf(x.id).length}명${membersOf(x.id).filter(u=>isSoonjang(u)).length?` · 순장 ${esc(membersOf(x.id).filter(u=>isSoonjang(u)).map(memberName).join(", "))}`:" · 순장 없음"}</div></div>
          <div style="display:flex;gap:4px"><button class="sbtn" data-act="renameSoon" data-id="${x.id}">이름</button><button class="sbtn danger" data-act="deleteSoon" data-id="${x.id}">삭제</button></div>
        </div>`).join("")}

    <h2>멤버 배정 · 역할</h2>
    <div class="card" style="padding:4px 16px">
      ${groups.map(([n,l])=>`<div class="grp">${esc(n)}</div>` + l.map(u=>{
        const m = store.members[u]; const fixed = !DEMO && CONFIG.ADMIN_IDS.includes(u);
        return `<div class="row">

              ${fixed?`<option>다락방장</option>`:`
              <option value="member" ${(!m.role||m.role==="member")?"selected":""}>순원</option>
              <option value="soon" ${m.role==="soon"?"selected":""}>순장</option>
              <option value="darak" ${m.role==="darak"?"selected":""}>다락방장</option>`}
            </select>
          </div>
        </div>`; }).join("")).join("") || `<div class="empty">아직 멤버가 없어요.</div>`}
    </div>

    <h2>정기 모임</h2>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>요일</label>
          <select id="s_wd"><option value="-1" ${Number(s.weekday)<0?"selected":""}>정기 모임 없음</option>${WD.map((w,i)=>`<option value="${i}" ${Number(s.weekday)===i?"selected":""}>매주 ${w}요일</option>`).join("")}</select></div>
        <div class="field"><label>시간</label><input id="s_time" type="time" value="${esc(s.time)}"></div>
      </div>
      <div class="field"><label>모임 이름</label><input id="s_title" value="${esc(s.title)}"></div>
      <div class="field"><label>출석부 시작일 (이 날짜부터 모임이 만들어져요)</label><input id="s_start" type="date" value="${esc(s.startDate||"")}"></div>
      <button class="sbtn primary" data-act="saveSettings">저장</button>
    </div>

    <h2>특별 모임 추가</h2>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>날짜</label><input id="n_date" type="date" min="${today}"></div>
        <div class="field"><label>시간</label><input id="n_time" type="time" value="${esc(s.time)}"></div>
      </div>
      <div class="field"><label>모임 이름</label><input id="n_title" placeholder="예: 다락방 송년회"></div>

          <div class="s">${esc(e.title)} · ${fmtTime(e.time)}${e.type==="special"?" · 특별":""}</div></div>

const $bg = document.getElementById("modalBg"), $modal = document.getElementById("modal");
function openModal(html){ $modal.innerHTML = html; $bg.classList.add("open"); }
function closeModal(){ $bg.classList.remove("open"); rosterId = null; }
$bg.addEventListener("click", e=>{ if(e.target===$bg && !$modal.querySelector("#j_name")) closeModal(); });
let rosterId = null;
function renderRoster(){
  const e = buildEvents({ includeCancelled:true }).find(x=>x.id===rosterId); if(!e) return closeModal();
  const uids = scopeUids(soonFilter).filter(u=>forEv(e,u));
  const row = u => { const r=resp(e.id,u); const ok=canMark(u); return `
    <div class="row">
      <div style="display:flex;align-items:center;gap:8px">${avatar(u,30)}
        <div><div class="t">${esc(memberName(u))}${roleLabel(u)?`<span class="role">${roleLabel(u)}</span>`:""}</div>
        <div class="s">${r.rsvp==="yes"?"참석 예고":r.rsvp==="no"?"불참 예고"+(r.reason?` · ${esc(r.reason)}`:""):"예고 없음"}${r.attendedBy==="self"?" · 본인 체크":""}</div></div>
      </div>
      <div class="att-btns">
        <button class="a-yes ${r.attended===true?"on":""}" data-act="mark" data-id="${e.id}" data-u="${u}" data-v="true" ${ok?"":"disabled"}>출석</button>
        <button class="a-no ${r.attended===false?"on":""}" data-act="mark" data-id="${e.id}" data-u="${u}" data-v="false" ${ok?"":"disabled"}>결석</button>
      </div>
    </div>`; };
  let body;
  if (isDarak() && soonFilter==="all"){
    body = [...soonList().map(s=>[s.name, membersOf(s.id)]), ["미배정", membersOf("none")]].map(([n,l])=>[n,l.filter(u=>forEv(e,u))]).filter(([,l])=>l.length)
      .map(([n,l])=>`<div class="grp">${esc(n)} · 출석 ${l.filter(u=>resp(e.id,u).attended===true).length}/${l.length}</div>${l.map(row).join("")}`).join("");
  } else body = uids.map(row).join("");
  openModal(`
    <h3>${fmtDate(e.date)} 출석부</h3>
    <div class="ev-meta" style="margin-bottom:12px">${esc(scopeTitle())} · ${esc(e.title)} · 출석 ${uids.filter(u=>resp(e.id,u).attended===true).length}/${uids.length}</div>
    <div class="card" style="padding:4px 16px">${body || `<div class="empty">멤버가 없어요.</div>`}</div>
    <button class="sbtn" style="width:100%;padding:12px" data-act="close">닫기</button>`);
}

/* ---------- 동작 ---------- */
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
const rid = (eid,uid)=> eid+"__"+uid;

document.addEventListener("click", async ev=>{
  const tb = ev.target.closest("[data-tab]");
  if (tb){ tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b = ev.target.closest("[data-act]"); if(!b || b.tagName==="SELECT") return;
  const { act, id } = b.dataset;
  try{
    switch(act){
      case "login": return login();
      case "logout": return logout();
      case "profile": return renderProfile();
      case "close": return closeModal();
      case "filter": soonFilter = id; return render();
      case "names": openNames.has(id)?openNames.delete(id):openNames.add(id); return render();
      case "joinGo": return joinGo();
      case "joinRole": { const n=document.getElementById("j_name"); if(n) joinDraft=n.value; joinMode=id; joinError=""; return maybeAskSoon(true); }
      case "joinLater": joinSkipped = true; sessionStorage.setItem("att_join_later","1"); closeModal(); return;
      case "openJoin": closeModal(); return maybeAskSoon(true);
      case "openCreate": return renderCreate();
      case "createEvent": {
        if (!canManage()) return;
        const date = document.getElementById("c_date").value, title = document.getElementById("c_title").value.trim();
        if (!date || !title) return toast("날짜와 모임 이름을 입력해 주세요");
        const time = document.getElementById("c_time").value, place = document.getElementById("c_place").value.trim();
        const soonId = isDarak() ? (document.getElementById("c_aud").value || null) : mySoon();
        const times = document.getElementById("c_weekly").checked ? 4 : 1;
        for (let k=0;k<times;k++){ const d=parse(date); d.setDate(d.getDate()+7*k);
          await save("events", "ev_"+Date.now()+"_"+k, { date:ymd(d), time, title, place, soonId, createdBy:user.id }); }
        closeModal(); toast(times>1 ? "모임 4개를 만들었어요" : "모임을 만들었어요"); return render();
      }
      case "withdraw": {
        if (!confirm("탈퇴하면 내 가입 정보와 참석·출석 기록이 모두 지워지고 되돌릴 수 없어요. 탈퇴할까요?")) return;
        const uid = user.id, sid = store.members[uid]?.soonId;
        for (const rid of Object.keys(store.responses).filter(k=>k.endsWith("__"+uid))) await remove("responses", rid);
        await remove("members", uid);
        const sn = store.soons[sid];
        if (sn){
          if (!Object.values(store.members).some(m=>m.soonId===sid)) await remove("soons", sid);   // 아무도 없는 순은 정리
          else if (sn.leaderUid===uid) await save("soons", sid, { leaderUid:null });
        }
        logout(); toast("탈퇴했어요"); return;
      }
      case "rsvp": {
        const cur = resp(id,user.id).rsvp, v = b.dataset.v;
        await save("responses", rid(id,user.id), { eventId:id, uid:user.id, rsvp: cur===v ? null : v, updatedAt:Date.now() });
        toast(cur===v ? "응답을 취소했어요" : v==="yes" ? "참석으로 알렸어요" : "참석이 어렵다고 알렸어요");
        return render();
      }
      case "reason": {
        const val = document.getElementById("reason_"+id).value.trim();
        await save("responses", rid(id,user.id), { reason:val, updatedAt:Date.now() });
        return toast("사유를 저장했어요");
      }
      case "checkin": {
        const done = resp(id,user.id).attended===true;
        await save("responses", rid(id,user.id), { eventId:id, uid:user.id, attended: done ? null : true, attendedBy: done ? null : "self", checkedAt: Date.now() });
        toast(done ? "출석을 취소했어요" : "출석 완료! 🙌");
        return render();
      }
      case "writeNotice": return renderNoticeForm();
      case "toggleNotices": showAllNotices = !showAllNotices; return render();
      case "postNotice": {
        const text = document.getElementById("nt_text").value.trim(); if (!text) return toast("내용을 입력해 주세요");
        const aud = document.getElementById("nt_aud").value;
        if (aud==="soon" && !isSoonjang()) return; if (aud!=="soon" && !isDarak()) return;
        await save("notices", "nt_"+Date.now(), { authorId:user.id, audience:aud, soonId: aud==="soon" ? mySoon() : null, text, createdAt:Date.now() });
        closeModal(); toast("공지를 올렸어요"); return render();
      }
      case "deleteNotice": if (!confirm("공지를 삭제할까요?")) return; await remove("notices", id); return render();
      case "shareNotice": {
        const n = store.notices[id];
        const msg = `[${CONFIG.GROUP_NAME} 공지 · ${audienceLabel(n)}]\n${n.text}\n\n${REDIRECT_URI}`;
        if (navigator.share) { try{ await navigator.share({ text:msg }); }catch(_){} }
        else { await navigator.clipboard.writeText(msg); toast("복사했어요. 단톡방에 붙여넣어 주세요"); }
        return;
      }
      case "roster": rosterId = id; return renderRoster();
      case "mark": {
        const u = b.dataset.u; if (!canMark(u)) return;
        const v = b.dataset.v==="true", cur = resp(id,u).attended;
        await save("responses", rid(id,u), { eventId:id, uid:u, attended: cur===v ? null : v, attendedBy:"leader", checkedBy:user.id, checkedAt:Date.now() });
        renderRoster(); return render();
      }
      case "saveName": {
        const n = document.getElementById("p_name").value.trim(); if(!n) return;
        await save("members", user.id, { name:n }); closeModal(); toast("이름을 바꿨어요"); return render();
      }
      case "addSoon": {
        if (!isDarak()) return;
        const n = document.getElementById("new_soon").value.trim(); if(!n) return toast("순 이름을 입력해 주세요");
        await save("soons", "soon_"+Date.now(), { name:n, order:soonList().length }); toast(`${n}을 만들었어요`); return render();
      }
      case "renameSoon": {
        const n = prompt("새 순 이름", soonName(id)); if (!n || !n.trim()) return;
        await save("soons", id, { name:n.trim() }); return render();
      }
      case "deleteSoon": {
        if (!confirm(`${soonName(id)}을 삭제할까요? 소속 멤버는 '미배정'이 돼요.`)) return;
        for (const u of membersOf(id)) await save("members", u, { soonId:null, role: store.members[u].role==="soon" ? "member" : store.members[u].role });
        await remove("soons", id); if (soonFilter===id) soonFilter="all"; return render();
      }
      case "saveSettings": {
        await save("config","settings",{ weekday:Number(document.getElementById("s_wd").value), time:document.getElementById("s_time").value, title:document.getElementById("s_title").value.trim()||"다락방 모임", startDate:document.getElementById("s_start").value || CONFIG.START_DATE });
        toast("정기 모임 설정을 저장했어요"); return render();
      }
      case "addEvent": {
        const date = document.getElementById("n_date").value, title = document.getElementById("n_title").value.trim();
        if (!date || !title) return toast("날짜와 이름을 입력해 주세요");
        await save("events", "sp_"+Date.now(), { date, time:document.getElementById("n_time").value, title, place:document.getElementById("n_place").value.trim(), createdBy:user.id });
        toast("특별 모임을 추가했어요"); return render();
      }
      case "addSoonEvent": {
        if (!isSoonjang()) return;
        const date = document.getElementById("so_date").value, title = document.getElementById("so_title").value.trim();
        if (!date || !title) return toast("날짜와 모임 이름을 입력해 주세요");
        const time = document.getElementById("so_time").value, place = document.getElementById("so_place").value.trim();
        const times = document.getElementById("so_weekly").checked ? 4 : 1;
        for (let k=0;k<times;k++){ const d=parse(date); d.setDate(d.getDate()+7*k);
          await save("events", "so_"+Date.now()+"_"+k, { date:ymd(d), time, title, place, soonId:mySoon(), createdBy:user.id }); }
        toast(times>1 ? "순 모임 4개를 만들었어요" : "순 모임을 만들었어요"); tab="upcoming"; return render();
      }
      case "cancelEvent": {
        const ev = buildEvents({ includeCancelled:true }).find(x=>x.id===id);
        if (!ev || !canCancel(ev) || !confirm("이 모임을 취소할까요?")) return;
        if (id.startsWith("reg_")){ const s=settings(); await save("config","settings",{ cancelled:[...new Set([...(s.cancelled||[]), id.slice(4)])] }); }
        else await remove("events", id);
        toast("모임을 취소했어요"); return render();
      }
      case "restoreEvent": {
        const s=settings(); await save("config","settings",{ cancelled:(s.cancelled||[]).filter(d=>d!==id.slice(4)) });
        toast("복구했어요"); return render();
      }
      case "demoRole": await save("members", user.id, { role:id, soonId: id==="darak" ? null : "s1" }); soonFilter="all"; tab="upcoming"; renderProfile(); return render();
      case "resetDemo": localStorage.removeItem("att_demo2"); localStorage.removeItem("att_demo2_user"); location.reload(); return;
    }
  }catch(e){ console.error(e); toast("저장 중 오류가 났어요"); }
});

document.addEventListener("change", async ev=>{
  const el = ev.target; if (!isDarak() || !el.dataset.act) return;
  const u = el.dataset.u;
  try{
    if (el.dataset.act==="setSoon"){ await save("members", u, { soonId: el.value || null }); toast(`${memberName(u)} → ${soonName(el.value)}`); }
    if (el.dataset.act==="setRole"){
      if (el.value==="soon" && !store.soons[store.members[u].soonId]) { toast("먼저 순을 배정해 주세요"); return render(); }
      await save("members", u, { role: el.value });
      if (el.value==="soon"){ const sid=store.members[u].soonId; await save("soons", sid, { leaderName: memberName(u), leaderUid:u, name:`${memberName(u)} 순` }); } toast(`${memberName(u)} → ${({member:"순원",soon:"순장",darak:"다락방장"})[el.value]}`);
    }
    render();
  }catch(e){ console.error(e); toast("저장 중 오류가 났어요"); }
});

/* ---------- 시작 ---------- */
await initAuth();
let started = false;
await initData(()=>{ if (started) { if (rosterId) renderRoster(); render(); maybeAskSoon(); } });
started = true;
if (user) await afterLogin(); else render();
</script>
